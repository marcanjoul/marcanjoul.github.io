<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@700&amp;display=swap');
      .ma { font-family: 'Cabin Sketch', cursive; font-weight: 700; }
    </style>
    <filter id="sketchy">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="4" result="noise"/>
