  </defs>

  <path d="M11,2.3 C5.2,2.3 2.3,4.9 2.3,10.2 L2.3,20.7 C2.3,26.7 5.5,29.4 12,29.4 L20,29.4 C26.8,29.4 29.7,26.8 29.7,21 L29.7,11 C29.7,4.7 26.7,2.3 19.5,2.3 Z"
        fill="#f3ede0" stroke="#000" stroke-width="1.7" stroke-linejoin="round" filter="url(#sketchy)"/>

  <text class="ma" x="10.5" y="22" font-size="14.5" fill="#000" text-anchor="middle" transform="rotate(-4 10.5 22)">M</text>
  <text class="ma" x="21.5" y="22.5" font-size="14.5" fill="#2b4dff" text-anchor="middle" transform="rotate(3 21.5 22.5)">A</text>

  <circle cx="25.8" cy="6.3" r="1.8" fill="#ffd400" stroke="#000" stroke-width="0.7" filter="url(#sketchy)"/>
